controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 50.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: "/mobile_base_controller/odom"
    speed_limit_topic: "/speed_limit"

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.15
      stateful: True
    # MPPI parameters
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vx_min: -0.5
      vx_max: 0.5
      vy_std: 0.2
      vy_max: 0.5
      wz_std: 0.2
      wz_max: 0.7
      ax_max: 0.6
      ay_max: 1.0
      az_max: 1.2
      iteration_count: 1
      prune_distance: 1.0
      transform_tolerance: 0.3
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 9.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        # Forward Preference — keeps the robot's heading aligned with the
        # path direction (forward/backward), matching the tested/preferred
        # behavior. Mode 1 (no directional preference) was tried and made
        # things worse in practice — reverted.
        mode: 0
      CostCritic:
        cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0

      use_sim_time: false

      global_frame: "odom"
      robot_base_frame: "base_link"
      robot_radius: 0.0
      # footprint: To be set by the robot specific configuration
      footprint_padding: 0.09

      resolution: 0.05
      track_unknown_space: False
      always_send_full_costmap: True

      rolling_window: True
      width: 5
      height: 5

      plugins: ["obstacle_voxel_layer", "inflation_layer"]
      filters: ["inflation_layer"] # Using Inflation in Keepout for https://github.com/open-navigation/navigation2/issues/1263

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58
        inflation_radius: 1.2

      # Full-pointcloud ground-filtered obstacle source for Nav2 — separate
      # from AMCL, which still localizes off the single-ring /scan_outdoor.
      # A single ring can miss obstacles outside that ring's scan plane;
      # VoxelLayer height-filters the raw /velodyne_points cloud itself,
      # natively in nav2_costmap_2d (no custom ground-removal node needed).
      obstacle_voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        observation_sources: velodyne
        footprint_clearing_enabled: True
        # Voxel grid used only to decide, per (x,y) column, whether enough
        # marked cells exist to mark that costmap cell (mark_threshold) —
        # the actual ground/obstacle split is min/max_obstacle_height below.
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 20
        mark_threshold: 0
        velodyne:
          topic: "/velodyne_points"
          data_type: "PointCloud2"
          expected_update_rate: 0.2 # seconds
          # Heights are relative to global_frame ("odom") after transform —
          # roughly ground level if odom's z=0 matches the robot's starting
          # height. VERIFY against this robot's actual base_link<->velodyne
          # TF (ros2 run tf2_ros tf2_echo base_link velodyne) before
          # trusting in the field; min_obstacle_height only needs to clear
          # ground-plane return noise, max_obstacle_height matches the old
          # scan layer's ceiling.
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          observation_persistence: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0

      # keepout_filter disabled: no CostmapFilterInfoServer/MapServer publish the mask yet.
      # Re-enable by adding "keepout_filter" back to `filters` above and restoring this block
      # once a keepout mask + filter info server are set up.
      # keepout_filter:
      #   plugin: "nav2_costmap_2d::KeepoutFilter"
      #   enabled: True
      #   filter_info_topic: "/keepout_map_mask/mask_info"