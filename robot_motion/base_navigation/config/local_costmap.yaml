local_costmap:
  ros__parameters:
    update_frequency: 10.0
    publish_frequency: 10.0

    use_sim_time: false

    global_frame: "odom"
    robot_base_frame: "base_link"
    robot_radius: 0.0
    # footprint: To be set by the robot specific configuration
    footprint_padding: 0.09

    resolution: 0.05
    track_unknown_space: False
    always_send_full_costmap: True

    rolling_window: True
    width: 5
    height: 5

    plugins: ["obstacle_voxel_layer", "inflation_layer"]

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 2.58
      inflation_radius: 1.2

    # Full-pointcloud ground-filtered obstacle source for Nav2 — separate
    # from AMCL, which still localizes off the single-ring /scan_outdoor.
    # A single ring can miss obstacles that don't happen to sit in that
    # ring's scan plane; VoxelLayer instead height-filters the raw
    # /velodyne_points cloud itself, natively in nav2_costmap_2d (no custom
    # ground-removal node needed).
    obstacle_voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: True
      publish_voxel_map: False
      observation_sources: velodyne
      footprint_clearing_enabled: True
      # Voxel grid used only to decide, per (x,y) column, whether enough
      # marked cells exist to mark that costmap cell (mark_threshold) — the
      # actual ground/obstacle split below (min/max_obstacle_height) is what
      # does the ground removal.
      origin_z: 0.0
      z_resolution: 0.1
      z_voxels: 20
      mark_threshold: 0
      velodyne:
        topic: "/velodyne_points"
        data_type: "PointCloud2"
        expected_update_rate: 0.2 # seconds
        # Heights are relative to global_frame ("odom") after the
        # PointCloud2 is transformed into it — i.e. roughly ground level if
        # odom's z=0 matches the robot's starting height. VERIFY against
        # this robot's actual base_link<->velodyne TF (ros2 run tf2_ros
        # tf2_echo base_link velodyne) before trusting these in the field;
        # min_obstacle_height only needs to clear ground-plane return
        # noise, max_obstacle_height matches the old scan layer's ceiling.
        min_obstacle_height: 0.10
        max_obstacle_height: 2.0
        clearing: True
        marking: True
        observation_persistence: 0.0
        raytrace_max_range: 6.0
        raytrace_min_range: 0.0
        obstacle_max_range: 5.5
        obstacle_min_range: 0.0
