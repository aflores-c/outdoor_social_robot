planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: false

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0

      use_sim_time: false

      global_frame: "map"
      robot_base_frame: "base_link"
      robot_radius: 0.36
      footprint: ""
      footprint_padding: 0.09

      resolution: 0.05
      track_unknown_space: True
      always_send_full_costmap: True

      plugins: ["static_layer", "obstacle_voxel_layer", "inflation_layer"]

      # Same VoxelLayer approach as the controller_server local_costmap
      # configs — see their comments for the full reasoning. AMCL still
      # uses /scan_outdoor unchanged.
      obstacle_voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        observation_sources: velodyne
        combination_method: 0
        footprint_clearing_enabled: True
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 20
        mark_threshold: 0
        velodyne:
          topic: "/velodyne_points"
          data_type: "PointCloud2"
          expected_update_rate: 0.2 # seconds
          # See controller_server_diff_drive.yaml's comment — verify
          # against this robot's actual base_link<->velodyne TF before
          # trusting in the field.
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          observation_persistence: 2.0
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 14.0
          obstacle_min_range: 0.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58
        inflation_radius: 1.2
