slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames
    odom_frame: "odom"
    map_frame: "map"
    base_frame: "base_footprint"

    # Laser input
    scan_topic: "/scan_outdoor"

    mode: mapping

    resolution: 0.05
    # Should match velodyne_vlp32c_bringup's scan_range_clamp_node max_range.
    # NOTE: this value turned out NOT to be the cause of the
    # "unable to get pointer in probability search" crash (tried both 60.0
    # and 25.0, both crashed identically) -- see correlation_search_space_*
    # below for the actual fix. 25.0 is kept here simply because it's more
    # than enough for a school-crossing scale map, built up incrementally as
    # the robot moves rather than from a single wide-radius scan.
    max_laser_range: 25.0
    minimum_time_interval: 0.3

    transform_timeout: 0.3
    tf_buffer_duration: 60.0

    # Movement thresholds before adding a new scan
    minimum_travel_distance: 0.15
    minimum_travel_heading: 0.15

    # Scan buffering
    scan_buffer_size: 60
    scan_buffer_maximum_scan_distance: 15.0

    # Scan-to-map matching distances
    link_scan_maximum_distance: 10.0
    loop_search_maximum_distance: 15.0

    # Correlation search
    # This is the actual root cause of the "unable to get pointer in
    # probability search" crash: Karto's m_pSearchSpaceProbs grid is sized
    # purely from correlation_search_space_dimension/resolution (NOT
    # max_laser_range, which we mistakenly chased first -- it has zero
    # effect on this specific grid). 0.02 (from both reference configs we
    # tried) hits a floating-point boundary/rounding edge case in Karto's
    # grid indexing. 0.01 is slam_toolbox's own shipped, most widely tested
    # default (config/mapper_params_online_async.yaml upstream) and avoids it.
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure
    do_loop_closing: true
    loop_match_minimum_chain_size: 8
    loop_match_minimum_response_coarse: 0.5
    loop_match_minimum_response_fine: 0.45

    # Scan matcher
    distance_variance_penalty: 0.5
    angle_variance_penalty: 0.2

    use_scan_matching: true
    use_scan_barycenter: true
    use_response_expansion: false

    enable_interactive_mode: true
