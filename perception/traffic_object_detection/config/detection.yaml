traffic_object_detector_node:
  ros__parameters:

    # ── Sensor topics ─────────────────────────────────────────────────────
    rgb_topic:         "/camera/realsense2_camera/color/image_raw"
    camera_info_topic: "/camera/realsense2_camera/color/camera_info"
    lidar_topic:       "/velodyne_points"

    # ── Camera <-> LiDAR transform ──────────────────────────────────────────
    # Read live from TF every frame (camera_frame -> lidar_frame), not from a
    # calibration YAML — stays correct even if camera_frame is on a moving
    # joint. Must match the optical frame_id actually used by rgb_topic/
    # camera_info_topic above, and must be connected to lidar_frame in TF.
    camera_frame: "camera_color_optical_frame"

    # ── YOLO ─────────────────────────────────────────────────────────────
    # Single pass, classes=[0,1,2,3,5,7] (person, bicycle, car, motorcycle, bus, truck)
    # — see traffic_object_detector_node.ALL_CLASSES
    # yolov8n.pt  → fastest, ~60fps on Jetson Orin
    # yolov8s.pt  → better accuracy, ~40fps
    # yolov8n.engine (TensorRT) → use after: yolo export model=yolov8n.pt format=engine
    yolo_model:  "yolov8n.pt"
    confidence:  0.40

    # ── Pose extraction ───────────────────────────────────────────────────
    # Minimum LiDAR returns inside a bounding box to accept the pose.
    # Vehicles are larger and typically produce more LiDAR returns.
    pedestrian_min_lidar_points: 5
    vehicle_min_lidar_points:    10
    bicycle_min_lidar_points:    7
    # Classes counted as "vehicle" for the stop/pass decision published on
    # vehicles_topic — subset of car/motorcycle/bus/truck/bicycle (see
    # traffic_object_detector_node.VEHICLE_CLASSES/BICYCLE_CLASSES).
    # Anything YOLO detects outside this list is dropped, not reclassified
    # as a pedestrian. Default (all): ["car","motorcycle","bus","truck","bicycle"]
    vehicle_classes: ["car"]
    # Discard LiDAR returns beyond this range (metres)
    max_range_m: 20.0

    # ── "Vehicle stopped" signal ────────────────────────────────────────
    # Single-target continuity heuristic (closest vehicle per frame, not
    # full multi-object tracking) — consumed by school_traffic_control's
    # VEHICLE_STOP -> CHECK_PLATE transition.
    stopped_confirm_time_s:         1.5
    stopped_distance_epsilon_m:     0.3
    stopped_association_distance_m: 2.0

    # ── TF frame for published poses and markers ──────────────────────────
    lidar_frame: "velodyne"

    # ── Debug image ───────────────────────────────────────────────────────
    # Throttled to reduce Jetson→PC bandwidth (1280x720 uncompressed = 82 MB/s at 30fps)
    # Set to 0.0 to publish every frame (only do this on localhost)
    debug_fps: 5.0

    # ── Synchronisation ───────────────────────────────────────────────────
    sync_slop_s: 0.10

    # ── Output for decision_making/school_traffic_control ─────────────────
    pedestrians_topic: "/perception/pedestrians"
    vehicles_topic:    "/perception/vehicles"

    # ── Perception load switching ───────────────────────────────────────
    # On by default — stays on through VEHICLE_STOP too (needed for the
    # "vehicle stopped" signal above). school_traffic_control only turns
    # this off (and vehicle_plate_detection on) during CHECK_PLATE.
    enabled_topic: "/perception/traffic_object_detection_enabled"
