plate_detector_node:
  ros__parameters:

    # ── Sensor topic ─────────────────────────────────────────────────────
    rgb_topic: "/head_front_camera/color/image_raw"

    # ── Plate detector ───────────────────────────────────────────────────
    # This must be a YOLO model FINE-TUNED on license plates — the COCO
    # weights used by traffic_object_detection have no "plate" class.
    # This bare filename only resolves if the process's cwd happens to
    # contain it — the launch files (detect.launch.py / detect_jetson.launch.py)
    # override this with the proper installed share/models/ path, so prefer
    # those over `ros2 run` with just this yaml.
    plate_model: "license_plate_detector.pt"
    confidence: 0.50

    # ── OCR (EasyOCR) ────────────────────────────────────────────────────
    ocr_languages: ["en"]
    ocr_min_confidence: 0.50
    min_plate_chars: 4

    # ── Throttling ───────────────────────────────────────────────────────
    # Detect+OCR is the heaviest pipeline in this workspace — throttle it
    # independently of camera fps.
    plate_check_rate_hz: 5.0
    debug_fps: 5.0

    # ── Output for decision_making/school_traffic_control ─────────────────
    plate_allowed_topic: "/perception/plate_allowed"
