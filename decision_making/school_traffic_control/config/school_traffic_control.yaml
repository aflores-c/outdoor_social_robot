school_traffic_control_node:
  ros__parameters:
    # Topics published by the perception stack
    vehicles_topic: /perception/vehicles
    pedestrians_topic: /perception/pedestrians
    plate_allowed_topic: /perception/plate_allowed

    # Perception load switching: traffic_object_detection and
    # vehicle_plate_detection are both heavy YOLO models the Jetson can't
    # comfortably run at once, so only one runs at a time — traffic
    # detection by default (including VEHICLE_STOP, which needs it for the
    # "vehicle stopped" signal), switched to plate detection only during
    # CHECK_PLATE, then switched back.
    traffic_detection_enabled_topic: /perception/traffic_object_detection_enabled
    plate_detection_enabled_topic: /perception/plate_detection_enabled

    # Action servers (base_navigation, play_motion2 and tts_engine bringup)
    go_to_xy_phi_action: go_to_xy_phi
    play_motion2_action: play_motion2
    tts_action: /tts_engine/tts

    # Pose A — middle of the road, default holding position
    # Captured via `ros2 run tf2_ros tf2_echo map base_link` at the robot's
    # holding spot.
    pose_a_x: -3.912
    pose_a_y: 25.471
    pose_a_phi_deg: 179.6

    # Pose B — cleared position used while letting a vehicle pass
    # Captured via `ros2 run tf2_ros tf2_echo map base_link` at the
    # pulled-aside spot.
    pose_b_x: -2.007
    pose_b_y: 23.564
    pose_b_phi_deg: 127.5

    # Arm gesture motion names — must exist in the play_motion2_mgr
    # `motions` parameter, see config/arm_motions.yaml
    motion_default: default_gesture
    motion_stop: stop_gesture
    motion_pass: pass_gesture

    # A vehicle triggers the stop gesture once its distance falls in this
    # close range [range_near_m, range_far_m] meters, for the whole
    # crossing interaction.
    range_near_m: 3.0
    range_far_m: 10.0

    # CHECK_PLATE: give up waiting for a registered-plate confirmation
    # after this long and fall back to WAIT_TO_LEAVE instead.
    plate_confirmation_timeout_s: 15.0

    # Plate noise filtering: plate_allowed is noise-filtered over a
    # sliding window rather than trusting the single latest reading — a
    # plate counts as confirmed once at least plate_vote_min_yes of the
    # last plate_vote_window readings were True.
    plate_vote_window: 5
    plate_vote_min_yes: 2

    # Optional safety gate (off by default): block the pass decision while a
    # pedestrian is within pedestrian_zone_m, even if the plate is allowed.
    pedestrian_safety_gate: false
    pedestrian_zone_m: 5.0

    # Pedestrian alert: within this range, warn verbally via TTS.
    # This never affects base/arm motion — traffic control stays the only
    # motion-driving task.
    pedestrian_alert_range_m: 5.0
    pedestrian_alert_message: "Caution, pedestrian, please stand clear."
    pedestrian_alert_cooldown_s: 5.0

    # Voice announcements on vehicle state transitions, via TTS.
    vehicle_stop_message: "Stop, please. Let the children cross."
    vehicle_pass_message: "You may proceed."

    # Sensor messages older than this are treated as stale/unknown
    message_timeout_s: 1.0
    control_rate_hz: 10.0
