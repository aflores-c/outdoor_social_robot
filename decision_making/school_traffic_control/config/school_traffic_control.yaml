school_traffic_control_node:
  ros__parameters:
    # Topics published by the perception stack
    vehicles_topic: /perception/vehicles
    pedestrians_topic: /perception/pedestrians
    plate_allowed_topic: /perception/plate_allowed
    # base_scan_proximity (SICK front+rear /scan) — OR'd with the
    # camera+velodyne pedestrian check above for the alert trigger.
    close_proximity_topic: /perception/close_proximity
    # Manual override: force the next plate check to pass (OCR pipeline
    # down). One-shot — auto-clears after authorizing one vehicle.
    force_plate_allowed_topic: /perception/force_plate_allowed
    # drone_traffic_perception's VehicleDetectionCounts topic.
    drone_vehicle_detections_topic: drone_vehicle_detections
    # Forces the EMERGENCY state (teleop) from anywhere; clear -> MIDDLE_IDLE.
    emergency_topic: /school_traffic_control/emergency
    # Field-trial event log (see decision_making/benchmark_logging).
    benchmark_events_topic: /benchmark/events

    # Perception load switching: traffic_object_detection and
    # vehicle_plate_detection are both heavy YOLO models the Jetson can't
    # comfortably run at once, so only one runs at a time — traffic
    # detection by default (including VEHICLE_STOP, which needs it for the
    # "vehicle stopped" signal), switched to plate detection only during
    # CHECK_PLATE, then switched back.
    traffic_detection_enabled_topic: /perception/traffic_object_detection_enabled
    plate_detection_enabled_topic: /perception/plate_detection_enabled

    # Action servers (base_navigation, play_motion2, robot_audio bringup)
    go_to_xy_phi_action: go_to_xy_phi
    play_motion2_action: play_motion2
    play_audio_action: play_audio

    # Pose A — middle of the road, default holding position
    # Captured via `ros2 run tf2_ros tf2_echo map base_link` at the robot's
    # holding spot.
    pose_a_x: 0.313
    pose_a_y: 0.082
    pose_a_phi_deg: 8.88

    # Pose B — cleared position used while letting a vehicle pass
    # Captured via `ros2 run tf2_ros tf2_echo map base_link` at the
    # pulled-aside spot.
    pose_b_x: 1.814
    pose_b_y: 1.186
    pose_b_phi_deg: -56.86

    # Arm gesture motion names — must exist in the play_motion2_mgr
    # `motions` parameter, see config/arm_motions.yaml
    motion_default: default_gesture
    motion_stop: stop_gesture
    motion_pass: pass_gesture

    # A vehicle triggers the stop gesture once its distance falls in this
    # close range [range_near_m, range_far_m] meters, for the whole
    # crossing interaction.
    range_near_m: 2.0
    range_far_m: 10.0

    # CHECK_PLATE: give up waiting for a registered-plate confirmation
    # after this long and fall back to WAIT_TO_LEAVE instead.
    plate_confirmation_timeout_s: 15.0

    # Plate noise filtering: plate_allowed is noise-filtered over a
    # sliding window rather than trusting the single latest reading — a
    # plate counts as confirmed once at least plate_vote_min_yes of the
    # last plate_vote_window readings were True.
    plate_vote_window: 5
    plate_vote_min_yes: 2

    # Optional safety gate (off by default): block the pass decision while a
    # pedestrian is within pedestrian_zone_m, even if the plate is allowed.
    pedestrian_safety_gate: false
    pedestrian_zone_m: 5.0

    # Pedestrian alert: within this range, play an audio clip. This never
    # affects base/arm motion — traffic control stays the only
    # motion-driving task. In MIDDLE_IDLE, pedestrian_introduction_message
    # plays instead of the plain alert; once a vehicle is being handled, we
    # focus on vehicles and fall back to pedestrian_alert_message.
    # Matches range_far_m above — pedestrians only get a single max-range
    # threshold (no near bound like vehicles' range_near_m/range_far_m
    # window), so this is set to the same far bound.
    pedestrian_alert_range_m: 10.0
    pedestrian_alert_message: "safe_audio.mp3"
    pedestrian_introduction_message: "presentation_audio.mp3"
    pedestrian_alert_cooldown_s: 5.0

    # Audio clips on vehicle state transitions, via robot_audio.
    vehicle_stop_message: "stop_audio.mp3"
    vehicle_pass_message: "enter_audio.mp3"
    # Played instead of vehicle_stop_message in WAIT_TO_LEAVE when a
    # parking space is free outside the school (see parking_free_threshold).
    vehicle_stop_goto_message: "go_to_sfo_audio.mp3"

    # VehicleDetectionCounts.raw_detections is buffered over this trailing
    # window and its statistical mode compared against parking_free_threshold.
    parking_free_threshold: 18
    parking_count_window_s: 1.0

    # Drone link staleness: no heartbeat topic exists upstream, so this is
    # inferred purely from gaps between VehicleDetectionCounts arrivals.
    # Not message_timeout_s (1.0s) — the drone's own RTMP reconnect cycle
    # is ~1s and would flap this constantly at that value.
    drone_link_timeout_s: 4.0

    # Sensor messages older than this are treated as stale/unknown
    message_timeout_s: 1.0
    control_rate_hz: 10.0
